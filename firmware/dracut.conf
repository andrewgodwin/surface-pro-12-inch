# Firmware for drivers that load from the initramfs (msm GPU, ADSP/CDSP remoteproc, iris).
# Without these the GPU and DSPs fail with -ENOENT before the root fs is mounted.
# Globs so they match whatever compression the distro uses (Fedora: .xz).
install_items+=" /usr/lib/firmware/qcom/gen71500_* /usr/lib/firmware/qcom/x1p42100/gen71500_zap* "
install_items+=" /usr/lib/firmware/qcom/x1p42100/Microsoft/Surface12/* "
