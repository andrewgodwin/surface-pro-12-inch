# Sourced by grub-mkconfig; must sort after ubuntu-x1e-settings.cfg.
# Drop ignore_unused flags; force sync_state past driverless consumers
# (1dfa000.crypto: no QCE driver; 3d6a000.gmu: never bound), which
# otherwise pin icc at INT_MAX and block CX/DDR collapse.
GRUB_CMDLINE_LINUX="$(echo "$GRUB_CMDLINE_LINUX" | sed -e 's/\bclk_ignore_unused\b//g' -e 's/\bpd_ignore_unused\b//g')"
for p in fw_devlink.sync_state=timeout; do
	case " $GRUB_CMDLINE_LINUX_DEFAULT " in
	*" $p "*) ;;
	*) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT $p" ;;
	esac
done
