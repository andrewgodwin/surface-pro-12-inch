# Unlock root in initrd; pin SAM/HID chain so the cover works at the prompt
# (Fedora builds hostonly initrds, which would otherwise omit them).
add_dracutmodules+=" crypt systemd-cryptsetup "
force_drivers+=" dm_crypt aes_ce_blk surface_aggregator surface_aggregator_registry surface_aggregator_hub surface_hid_core surface_hid hid_generic hid_multitouch "
