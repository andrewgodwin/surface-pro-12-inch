# Non-hostonly dracut doesn't embed crypttab: pass it on the cmdline.
if [ -r /etc/crypttab ]; then while read -r name dev _ opts; do
	case "$name" in ''|\#*) continue ;; esac
	uuid=${dev#UUID=}; [ "$uuid" = "$dev" ] && continue
	for p in "rd.luks.name=$uuid=$name" $(case ",$opts," in *,discard,*) echo "rd.luks.options=$uuid=discard" ;; esac); do
		case " $GRUB_CMDLINE_LINUX " in
		*" $p "*) ;;
		*) GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX $p" ;;
		esac
	done
done < /etc/crypttab; fi
