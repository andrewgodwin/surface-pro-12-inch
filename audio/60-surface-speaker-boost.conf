# Speaker loudness without raising the 0 dB kernel caps (no VI-sense protection):
# sc4 compressor (+9 dB makeup) -> lookahead limiter (ceiling -1 dBFS) -> speakers.
# Peaks never exceed what the raw sink already allows; only average level rises.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "Speakers (boosted)"
      media.name       = "Speakers (boosted)"
      filter.graph = {
        nodes = [
          { type = ladspa name = comp plugin = sc4_1882 label = sc4
            control = {
              "RMS/peak" = 0.5
              "Attack time (ms)" = 10
              "Release time (ms)" = 150
              "Threshold level (dB)" = -18
              "Ratio (1:n)" = 2
              "Knee radius (dB)" = 6
              "Makeup gain (dB)" = 9
            } }
          { type = ladspa name = lim plugin = fast_lookahead_limiter_1913 label = fastLookaheadLimiter
            control = {
              "Input gain (dB)" = 0
              "Limit (dB)" = -1
              "Release time (s)" = 0.05
            } }
        ]
        links = [
          { output = "comp:Left output"  input = "lim:Input 1" }
          { output = "comp:Right output" input = "lim:Input 2" }
        ]
        inputs  = [ "comp:Left input" "comp:Right input" ]
        outputs = [ "lim:Output 1" "lim:Output 2" ]
      }
      audio.channels = 2
      audio.position = [ FL FR ]
      capture.props = {
        node.name        = "surface_speaker_boost"
        media.class      = Audio/Sink
        priority.session = 1001
        priority.driver  = 1001
      }
      playback.props = {
        node.name    = "surface_speaker_boost.out"
        node.passive = true
        target.object = "alsa_output.platform-sound.HiFi__Speaker__sink"
      }
    }
  }
]
